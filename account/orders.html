<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Consent defaults must run before any tracking tags. -->
    <script src="../cookie-consent-config.js"></script>
    <script src="../cookie-consent.js"></script>
    <link rel="stylesheet" href="../cookie-consent.css">
    <script src="../cookie-preferences.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nubie | Orders</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .orders-list {
            margin-top: 24px !important;
        }
    </style>
</head>
<body class="minimal-grey-theme">
    <div id="navbar-placeholder" data-nav-type="standard"></div>



    <main class="account-container">
        <nav class="account-tabs">
            <a href="overview.html" class="tab-link">Overview</a>
            <a href="orders.html" class="tab-link active">Orders</a>
            <a href="personal-data.html" class="tab-link">Personal Data</a>
            <a href="stay-in-the-know.html" class="tab-link">Stay in the Know</a>
            <a href="invite.html" class="tab-link">Invite</a>
        </nav>

        <div id="orders" class="tab-pane active">
            <div class="account-main">
                <header class="account-header">
                    <h1>My Orders</h1>
                </header>
                
                <div id="orders-loading" style="text-align: center; padding: 40px;">
                    <p style="color: #999; font-size: 13px; letter-spacing: 1px;">FETCHING YOUR ORDERS...</p>
                </div>

                <div id="orders-list" class="orders-list" style="display: none;">
                    <!-- Orders will be injected here -->
                </div>

                <div id="orders-empty" style="display: none; text-align: center; padding: 80px 0;">
                    <p class="empty-msg" style="margin-bottom: 40px; font-size: 14px;">You haven't placed any orders yet.</p>
                    <a href="../product.html" class="btn btn-dark btn-pill btn-auth-width" style="max-width: 240px; margin: 0 auto; height: 48px; display: flex; align-items: center; justify-content: center; text-decoration: none;">Discover Products</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../i18n.js"></script>
    <script src="../navbar.js"></script>
    <script src="../script.js"></script>
    <script src="../cart.js"></script>
    <script src="../supabase-config.js"></script>
    <script src="../auth.js"></script>
    <script src="../footer.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ordersList = document.getElementById('orders-list');
            const ordersLoading = document.getElementById('orders-loading');
            const ordersEmpty = document.getElementById('orders-empty');

            async function fetchOrders() {
                try {
                    // 1. Get Session from localStorage to avoid SDK hangs
                    const storageKey = 'sb-qsbrjlhnklnfblqulzwn-auth-token';
                    const storedSession = localStorage.getItem(storageKey);
                    if (!storedSession) {
                        window.location.href = '../login.html';
                        return;
                    }

                    const sessionData = JSON.parse(storedSession);
                    const token = sessionData.access_token;
                    const userEmail = sessionData.user.email;

                    if (!token) throw new Error("No auth token");

                    // 2. Fetch Orders for this user (using email as primary filter as defined in schema)
                    // We also select order_items as a sub-query
                    const response = await fetch(
                        `https://qsbrjlhnklnfblqulzwn.supabase.co/rest/v1/orders?user_email=eq.${userEmail}&select=*,order_items(*)&order=created_at.desc`, 
                        {
                            method: 'GET',
                            headers: {
                                'apikey': 'sb_publishable_N9ZhvV24PWSlXIDbDVC5sQ_Ee_3sulV',
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            }
                        }
                    );

                    if (!response.ok) throw new Error("Failed to fetch orders");

                    const orders = await response.json();
                    
                    ordersLoading.style.display = 'none';

                    if (!orders || orders.length === 0) {
                        ordersEmpty.style.display = 'block';
                        return;
                    }

                    ordersList.style.display = 'flex';
                    ordersList.innerHTML = '';

                    orders.forEach(order => {
                        const date = new Date(order.created_at).toLocaleDateString('en-GB', {
                            day: '2-digit',
                            month: 'short',
                            year: 'numeric'
                        });
                        const time = new Date(order.created_at).toLocaleTimeString('en-GB', {
                            hour: '2-digit',
                            minute: '2-digit'
                        });

                        const status = (order.status || 'pending').toLowerCase();
                        let statusLabel = status.toUpperCase();
                        if (statusLabel === 'PAID' || statusLabel === 'PENDING') statusLabel = 'ORDERED';
                        
                        const itemCount = order.order_items.length;
                        const firstItem = order.order_items[0]?.product_title || 'Unknown Item';
                        const itemSummary = itemCount > 1 ? `${firstItem} + ${itemCount - 1} more` : firstItem;

                        const orderRow = document.createElement('div');
                        orderRow.className = 'order-summary-row';
                        orderRow.onclick = () => window.location.href = `order-detail.html?id=${order.id}`;
                        orderRow.innerHTML = `
                            <div class="summary-col ref">
                                <span class="label">Reference</span>
                                <span class="value">#${order.order_number}</span>
                            </div>
                            <div class="summary-col date">
                                <span class="label">Date & Time</span>
                                <span class="value">${date} at ${time}</span>
                            </div>
                            <div class="summary-col items">
                                <span class="label">Item Detail</span>
                                <span class="value">${itemSummary}</span>
                            </div>
                            <div class="summary-col price">
                                <span class="label">Price</span>
                                <span class="value">฿${parseFloat(order.total_amount).toLocaleString()}</span>
                            </div>
                            <div class="summary-col status">
                                <span class="label">Status</span>
                                <span class="value status-text-${status}">${statusLabel}</span>
                            </div>
                            <div class="summary-col action">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            </div>
                        `;
                        ordersList.appendChild(orderRow);
                    });

                } catch (err) {
                    console.error("Orders Error:", err);
                    ordersLoading.innerHTML = `<p style="color: #D9291C; font-size: 13px;">Error loading orders. Please try again.</p>`;
                }
            }

            // Start fetching
            fetchOrders();
        });
    </script>
</body>
</html>
